[package]
name = "gibson"
version = "0.2.0"
edition = "2021"

[dependencies]
netstat2 = "0.9"
sysinfo = "0.29"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dns-lookup = "1.0"
humantime = "2.1"
ipnetwork = "0.20"
anyhow = "1.0"
hostname = "0.3"
flate2 = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
pbkdf2 = "0.12"
